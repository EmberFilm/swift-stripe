name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS / Swift 6.3
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift build --build-tests
      - run: swift test

  # The Linux jobs above build against glibc Foundation. Consumers cross-compiling with the
  # static SDK get FoundationEssentials instead, which has no CharacterSet and resolves `pow`
  # to the Decimal overload — breakage neither job above can see.
  musl:
    name: Static Linux SDK (FoundationEssentials)
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - name: Install the static Linux SDK
        run: |
          swift sdk install \
            "https://download.swift.org/swift-6.3.3-release/static-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz" \
            --checksum "$STATIC_SDK_CHECKSUM"
        env:
          STATIC_SDK_CHECKSUM: ${{ vars.STATIC_SDK_CHECKSUM }}
      - run: swift build --swift-sdk aarch64-swift-linux-musl

  linux:
    name: Linux / Swift ${{ matrix.swift }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.3"]
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
      - run: swift build --build-tests
      - run: swift test
