name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS / Swift 6.3
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift build --build-tests
      - run: swift test

  # The Linux jobs above build against glibc Foundation. Consumers cross-compiling with the
  # static SDK get FoundationEssentials instead, which has no CharacterSet and resolves `pow`
  # to the Decimal overload — breakage neither job above can see.
  foundation-linking:
    name: Foundation linking
    uses: vapor/ci/.github/workflows/check-foundation-linking.yml@main
    with:
      swift_image: swift:6.3-noble

  model-drift:
    name: Model drift against the OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to a commit, not master: a Stripe release adding fields is not a regression in
      # this package. Bumping the pin is a deliberate change that lands alongside the fields.
      - name: Fetch the pinned spec
        run: |
          curl -sSL -o spec3.sdk.json \
            "https://raw.githubusercontent.com/stripe/openapi/$STRIPE_OPENAPI_COMMIT/openapi/spec3.sdk.json"
        env:
          STRIPE_OPENAPI_COMMIT: a99d7764af677e1ddecf18dccb0cb8f99ceda9a4
      - run: Scripts/model-drift.py spec3.sdk.json
      - name: Generated sources match the pinned spec
        run: |
          Scripts/generate-models.py spec3.sdk.json --check
          Scripts/generate-requests.py spec3.sdk.json --check
      - name: README shows the generated API version
        run: grep -q "$(sed -n 's/.*generatedAPIVersion = "\(.*\)"/\1/p' Sources/Stripe/Models/APIVersion.swift)" README.md

  linux:
    name: Linux / Swift ${{ matrix.swift }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.3"]
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
      - run: swift build --build-tests
      - run: swift test
