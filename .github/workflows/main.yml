name: Main

permissions:
  contents: read

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8,20 * * *"

jobs:
  unit-tests:
    name: Unit tests
    uses: apple/swift-nio/.github/workflows/unit_tests.yml@main
    with:
      # The manifest is swift-tools-version 6.3; older toolchains cannot read it.
      linux_6_0_enabled: false
      linux_6_1_enabled: false
      linux_6_2_enabled: false
      linux_nightly_6_0_enabled: false
      linux_nightly_6_1_enabled: false
      linux_6_3_arguments_override: "-Xswiftc -require-explicit-sendable"
      linux_nightly_next_arguments_override: "-Xswiftc -require-explicit-sendable"
      linux_nightly_main_arguments_override: "-Xswiftc -require-explicit-sendable"

  release-builds:
    name: Release builds
    uses: apple/swift-nio/.github/workflows/release_builds.yml@main
    with:
      linux_6_0_enabled: false
      linux_6_1_enabled: false
      linux_6_2_enabled: false

  foundation-linking:
    name: Foundation linking
    uses: vapor/ci/.github/workflows/check-foundation-linking.yml@main
    with:
      swift_image: swift:6.3-noble
